{% extends "base.html" %}
{% block content %}
  <div class="grid cols-3">
    <div class="card">
      <h3>Быстрые действия</h3>
      <div class="stack" style="margin-top:8px;">
        <a class="btn btn-primary" href="/news">Создать новость</a>
        <a class="btn" href="/posts">Открыть публикации</a>
        <a class="btn" href="/jobs">Открыть журнал задач</a>
      </div>
    </div>
    <div class="card">
      <h3>Состояние</h3>
      <div class="muted">Приложение запущено</div>
      <div style="margin-top:6px;">
        Health: <a href="/health">/health</a>
        <div id="active_jobs" style="margin-top:6px;">Активные задачи: <span id="jobs_count">—</span></div>
      </div>
    </div>
    <div class="card">
      <h3>Инструменты</h3>
      <div class="stack" style="margin-top:8px;">
        <a class="btn" href="/steam">Steam Export</a>
        <a class="btn" href="/accounts">Аккаунты</a>
      </div>
    </div>
  </div>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const r = await fetch('/api/jobs/active');
      if (r.ok) {
        const j = await r.json();
        document.getElementById('jobs_count').textContent = (j && typeof j.count === 'number') ? j.count : '0';
      }
    } catch (e) {
      document.getElementById('jobs_count').textContent = '0';
    }
  });
  </script>
{% endblock %}
