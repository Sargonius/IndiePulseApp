<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>IndiePulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v={{ request.app.state.asset_version if request and request.app and request.app.state and request.app.state.asset_version else '1' }}">
</head>
<body class="{{ body_class or '' }}">
	<header>
		<div class="inner">
			<h1>IndiePulse</h1>
			<nav>
				<a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Главная</a>
				<a href="/news" class="{% if request.url.path.startswith('/news') %}active{% endif %}">Новость</a>
				<a href="/posts" class="{% if request.url.path.startswith('/posts') %}active{% endif %}">Публикации</a>
				<a href="/jobs" class="{% if request.url.path.startswith('/jobs') %}active{% endif %}">Задачи</a>
				<a href="/steam" class="{% if request.url.path.startswith('/steam') %}active{% endif %}">Steam Export</a>
				<a href="/accounts" class="{% if request.url.path.startswith('/accounts') %}active{% endif %}">Аккаунты</a>
				<span id="nav_ar_btn" class="nav-inline" hx-get="/api/system/autoreload_status" hx-trigger="load" hx-swap="innerHTML"></span>
			</nav>
		</div>
	</header>
	<main>
		<div class="container">
			<div style="display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:8px;">
				<button class="btn" title="Restart server" hx-post="/api/system/restart" hx-target="#restart_status" hx-swap="innerHTML">⭮ Перезапуск</button>
			</div>
			<div id="restart_status" class="muted" style="margin-bottom:12px;"></div>
			{% block content %}{% endblock %}
		</div>
	</main>
</body>
</html>
