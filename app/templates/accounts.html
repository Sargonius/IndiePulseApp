{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>

<div id="settings_container">
	<!-- The sections of app/core/settings_schema.py in order: made from their fields (partials/settings_section.html)
	     or hand-written (partials/settings/<id>.html: OAuth connect flows, the destinations editor, Updates). A
	     module that is off: its section is hidden by base.html. -->
	{% for sec in sections %}
	{% if sec.form %}{% include "partials/settings_section.html" %}{% else %}{% include sec.section.custom %}{% endif %}
	{% endfor %}
</div>

<link rel="stylesheet" href="/static/settings.css?v={{ request.app.state.asset_version if request and request.app and request.app.state and request.app.state.asset_version else '1' }}">
<script src="/static/settings.js?v={{ request.app.state.asset_version if request and request.app and request.app.state and request.app.state.asset_version else '1' }}"></script>
{% endblock %}
