{% extends "base.html" %}
{% block content %}
<h2>Analytics</h2>

<div class="analytics-controls">
	<div class="toolbar">
		<button class="btn btn-primary" id="refresh_all_btn" hx-post="/api/analytics/refresh" hx-target="#analytics_table" hx-swap="outerHTML">
			<span class="htmx-indicator">⏳</span>
			Update Metrics
		</button>
		<button class="btn" id="reload_table_btn" hx-get="/api/analytics/table" hx-target="#analytics_table" hx-swap="outerHTML">
			Reload Table
		</button>
		<button class="btn" id="expand_all_btn" type="button" onclick="toggleAllGroups()">Expand all</button>
		<span id="refresh_all_status" class="muted"></span>
	</div>
	
	<div class="filters">
		<label>
			<span>Platform:</span>
			<select id="filter_platform" onchange="filterAnalytics()">
				<option value="">All</option>
				<option value="vk">VK</option>
				<option value="x">X / Twitter</option>
				<option value="discord">Discord</option>
				<option value="tg">Telegram</option>
				<option value="reddit">Reddit</option>
				<option value="fb">Facebook</option>
				<option value="bluesky">Bluesky</option>
				<option value="yt">YouTube</option>
				<option value="tiktok">TikTok</option>
			</select>
		</label>
		<label>
			<span>Status:</span>
			<select id="filter_status" onchange="filterAnalytics()">
				<option value="">All</option>
				<option value="done">Published</option>
				<option value="queued">Queued</option>
				<option value="error">Error</option>
			</select>
		</label>
		<label>
			<span>Period:</span>
			<select id="filter_period" onchange="filterAnalytics()">
				<option value="">All Time</option>
				<option value="today">Today</option>
				<option value="week">Last 7 Days</option>
				<option value="month">Last 30 Days</option>
			</select>
		</label>
	</div>
</div>

<div class="analytics-summary" id="analytics_summary">
	<!-- Summary stats will be calculated by JS -->
</div>

<div id="analytics_table" hx-get="/api/analytics/table" hx-trigger="load" hx-swap="outerHTML">
	<div style="text-align:center; padding:40px; color:#666;">
		Loading analytics data...
	</div>
</div>

<style>
/* Widen the analytics page so the metrics table has room for more columns/rows.
   Header inner is widened too so the nav stays aligned with the content. */
body.page-analytics .container,
body.page-analytics header .inner {
	max-width: 1800px;
}

.analytics-controls {
	display: flex;
	flex-direction: column;
	gap: 12px;
	margin-bottom: 20px;
}

.filters {
	display: flex;
	gap: 16px;
	flex-wrap: wrap;
	align-items: center;
}

.filters label {
	display: flex;
	align-items: center;
	gap: 6px;
	font-weight: 500;
}

.filters select {
	min-width: 140px;
}

.analytics-summary {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
	gap: 12px;
	margin-bottom: 20px;
}

.summary-card {
	background: var(--card);
	border: 1px solid var(--border);
	border-radius: 10px;
	padding: 16px;
	text-align: center;
}

.summary-card .value {
	font-size: 28px;
	font-weight: 700;
	color: var(--primary);
}

.summary-card .label {
	font-size: 12px;
	color: var(--muted);
	text-transform: uppercase;
	margin-top: 4px;
}

.summary-card.success .value { color: var(--success); }
.summary-card.warning .value { color: var(--warning); }
.summary-card.danger .value { color: var(--danger); }

/* Hide rows that don't match filter */
.analytics-row.filtered-out,
.pub-group.filtered-out {
	display: none !important;
}
</style>

<script>
// The table header sticks right under the fixed site header, whatever its height (nav may wrap)
(function syncHeaderHeight() {
	const h = document.querySelector('header');
	const set = () => document.documentElement.style.setProperty('--site-header-h', h.offsetHeight + 'px');
	set();
	window.addEventListener('resize', set);
	window.addEventListener('load', set);  // web font changes the height
})();

// Publications the user opened (brief ids), kept across table reloads and visits
const OPEN_KEY = 'analytics_open_publications';
let openGroups = new Set();
try { openGroups = new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || '[]')); } catch (e) {}

function saveOpenGroups() {
	// only what is on the page, so the list doesn't grow forever
	const onPage = new Set(Array.from(document.querySelectorAll('#analytics_table .pub-group')).map(g => g.dataset.brief));
	openGroups = new Set([...openGroups].filter(id => onPage.has(id)));
	try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openGroups])); } catch (e) {}
}

function toggleGroup(ev, row) {
	if (ev.target.closest('a, button, img, input, select')) return;
	const group = row.closest('.pub-group');
	const open = !group.classList.contains('open');
	group.classList.toggle('open', open);
	if (open) openGroups.add(group.dataset.brief); else openGroups.delete(group.dataset.brief);
	saveOpenGroups();
	updateExpandAllLabel();
}

function visibleGroups() {
	return Array.from(document.querySelectorAll('#analytics_table .pub-group:not(.filtered-out)'));
}

function toggleAllGroups() {
	const groups = visibleGroups();
	const open = !groups.every(g => g.classList.contains('open'));
	groups.forEach(g => {
		g.classList.toggle('open', open);
		if (open) openGroups.add(g.dataset.brief); else openGroups.delete(g.dataset.brief);
	});
	saveOpenGroups();
	updateExpandAllLabel();
}

function updateExpandAllLabel() {
	const btn = document.getElementById('expand_all_btn');
	const groups = visibleGroups();
	if (btn) btn.textContent = groups.length && groups.every(g => g.classList.contains('open')) ? 'Collapse all' : 'Expand all';
}

const SUM_KEYS = ['likes', 'reposts', 'comments', 'views'];

function metricHtml(v) {
	return v === null ? '<span class="metric-pending">—</span>' : `<span class="metric-value">${v}</span>`;
}

function filterAnalytics() {
	const platform = document.getElementById('filter_platform').value.toLowerCase();
	const status = document.getElementById('filter_status').value.toLowerCase();
	const period = document.getElementById('filter_period').value;

	const now = new Date();
	const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
	const weekAgo = new Date(todayStart.getTime() - 7 * 24 * 60 * 60 * 1000);
	const monthAgo = new Date(todayStart.getTime() - 30 * 24 * 60 * 60 * 1000);

	function passes(row) {
		const rowPlatform = (row.dataset.platform || '').toLowerCase();
		const rowStatus = (row.dataset.status || '').toLowerCase();
		const rowDateStr = row.dataset.published || '';
		const rowDate = rowDateStr ? new Date(rowDateStr) : null;
		if (platform && !rowPlatform.includes(platform)) return false;
		if (status && rowStatus !== status) return false;
		if (period && rowDate) {
			if (period === 'today' && rowDate < todayStart) return false;
			if (period === 'week' && rowDate < weekAgo) return false;
			if (period === 'month' && rowDate < monthAgo) return false;
		} else if (period && !rowDate && status !== 'queued') {
			// Hide posts without publish date if filtering by period (except queued)
			return false;
		}
		return true;
	}

	const totals = { pubs: 0, posts: 0, engaged: 0, likes: 0, reposts: 0, comments: 0, views: 0 };

	document.querySelectorAll('#analytics_table .pub-group').forEach(group => {
		group.classList.toggle('open', openGroups.has(group.dataset.brief));
		// sums over the networks that pass the filters (null = no network reports it)
		const sums = { likes: null, reposts: null, comments: null, views: null };
		let engagement = 0, has = false, visible = 0;
		group.querySelectorAll('.analytics-row').forEach(row => {
			const show = passes(row);
			row.classList.toggle('filtered-out', !show);
			const badge = group.querySelector(`.pub-platforms [data-post="${row.dataset.post}"]`);
			if (badge) badge.classList.toggle('dim', !show);
			if (!show) return;
			visible++;
			SUM_KEYS.forEach(k => {
				if (row.dataset[k] !== '') sums[k] = (sums[k] || 0) + (parseInt(row.dataset[k]) || 0);
			});
			engagement += parseInt(row.dataset.engagement) || 0;
			has = has || row.dataset.has === '1';
		});
		group.classList.toggle('filtered-out', visible === 0);
		if (!visible) return;

		SUM_KEYS.forEach(k => {
			const cell = group.querySelector(`.pub-row [data-sum="${k}"]`);
			if (cell) cell.innerHTML = metricHtml(sums[k]);
			totals[k] += sums[k] || 0;
		});
		const totalCell = group.querySelector('.pub-row [data-sum="total"]');
		if (totalCell) totalCell.innerHTML = engagement > 0
			? `<span class="engagement-badge">🔥 ${engagement}</span>`
			: `<span class="metric-pending">${has ? '0' : '—'}</span>`;
		group.querySelector('.pub-row').classList.toggle('has-engagement', engagement > 0);

		totals.pubs++;
		totals.posts += visible;
		if (engagement > 0) totals.engaged++;
	});

	updateSummary(totals);
	updateExpandAllLabel();
}

function updateSummary(t) {
	document.getElementById('analytics_summary').innerHTML = `
		<div class="summary-card">
			<div class="value">${t.pubs}</div>
			<div class="label">Publications</div>
		</div>
		<div class="summary-card">
			<div class="value">${t.posts}</div>
			<div class="label">Posts</div>
		</div>
		<div class="summary-card success">
			<div class="value">${t.engaged}</div>
			<div class="label">🔥 Got Reactions</div>
		</div>
		<div class="summary-card success">
			<div class="value">${t.likes}</div>
			<div class="label">Total Likes</div>
		</div>
		<div class="summary-card">
			<div class="value">${t.reposts}</div>
			<div class="label">Reposts</div>
		</div>
		<div class="summary-card">
			<div class="value">${t.comments}</div>
			<div class="label">Comments</div>
		</div>
		<div class="summary-card">
			<div class="value">${t.views}</div>
			<div class="label">Views</div>
		</div>
	`;
}

// Initialize summary after table loads
document.addEventListener('htmx:afterSwap', function(e) {
	if (e.detail.target.id === 'analytics_table') {
		filterAnalytics();
	}
});

// Auto-refresh metrics on page load after 1 second delay
document.addEventListener('DOMContentLoaded', function() {
	setTimeout(function() {
		filterAnalytics();
	}, 1500);
});
</script>
{% endblock %}
