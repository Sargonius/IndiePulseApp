<div class="instructions">
	<h4>Hashtags</h4>
	<p>The <b>Suggest</b> button next to the hashtags field of “📷 Post” puts these in; change them there for a single
		post. They are added to the text on VK, Facebook, Reddit, YouTube and Instagram.</p>
	<p>Separate them with spaces; a missing <code>#</code> is added.</p>
</div>
