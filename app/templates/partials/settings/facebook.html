{#- Settings → Facebook, its hand-written part (inside partials/settings_section.html): fetch the Pages with a
    user token, or fill them in by hand (/api/settings/save). -#}
<h4 style="margin:0 0 8px 0;">Easy setup</h4>
<form hx-post="/api/facebook/fetch_pages" hx-target="#fb_pages_list" hx-swap="innerHTML">
	<div class="form-group">
		<label>App ID</label>
		<input type="text" name="fb_app_id" value="{{ fb_app_id or '' }}" />
	</div>
	<div class="form-group">
		<label>App Secret</label>
		<input type="text" name="fb_app_secret" value="{{ fb_app_secret or '' }}" />
	</div>
	<div class="form-group">
		<label>User Access Token (from Graph API Explorer)</label>
		<input type="text" name="fb_user_token" value="" placeholder="EAAB..." />
	</div>
	<div class="btn-row">
		<button type="submit" class="btn btn-primary">Fetch My Pages</button>
		<button type="button" class="btn" hx-get="/api/facebook/test" hx-target="#fb_status" hx-swap="innerHTML">Test</button>
	</div>
</form>
<div id="fb_pages_list" class="status-msg"></div>
<div id="fb_status" class="status-msg"></div>
<details style="margin-top:12px;">
	<summary style="cursor:pointer;color:#666;">Manual fields (advanced)</summary>
	<form hx-post="/api/settings/save" hx-target="#fb_status" hx-swap="innerHTML" style="margin-top:8px;">
		<div class="form-group">
			<label>RU Page ID</label>
			<input type="text" name="fb_ru_page_id" value="{{ fb_ru_page_id or '' }}" />
		</div>
		<div class="form-group">
			<label>RU Page Access Token</label>
			<input type="text" name="fb_ru_page_access_token" value="{{ fb_ru_page_access_token or '' }}" />
		</div>
		<div class="form-group">
			<label>EN Page ID</label>
			<input type="text" name="fb_en_page_id" value="{{ fb_en_page_id or '' }}" />
		</div>
		<div class="form-group">
			<label>EN Page Access Token</label>
			<input type="text" name="fb_en_page_access_token" value="{{ fb_en_page_access_token or '' }}" />
		</div>
		<div class="btn-row">
			<button type="submit" class="btn btn-primary">Save</button>
		</div>
	</form>
</details>
