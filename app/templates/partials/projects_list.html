<div id="projects_list">
{% if projects %}
  {% for p in projects %}
  <div class="settings-section" id="project_{{ p.id }}" style="margin-bottom:10px;">
    <div style="padding:14px 18px;">
      <!-- View mode -->
      <div class="project-view-row project-view-{{ p.id }}" style="display:flex; align-items:center; gap:14px;">
        <div style="flex-shrink:0;">
          {% if p.icon_url %}
            <img src="{{ p.icon_url }}" class="project-icon" alt="{{ p.name }}" />
          {% else %}
            <div class="project-icon-placeholder">{{ p.name[0]|upper }}</div>
          {% endif %}
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:15px;">{{ p.name }}</div>
          <div class="muted" style="font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ p.tags_json or '—' }}</div>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="btn btn-sm" onclick="toggleProjectEdit({{ p.id }})">Edit</button>
          <button class="btn btn-sm" style="color:#b91c1c; border-color:#fca5a5;"
                  hx-post="/api/projects/{{ p.id }}/delete"
                  hx-target="#projects_list"
                  hx-swap="outerHTML"
                  hx-confirm="Delete project '{{ p.name }}'?">Delete</button>
        </div>
      </div>
      <!-- Edit mode (hidden) -->
      <div class="project-edit-{{ p.id }}" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
        <form enctype="multipart/form-data"
              hx-post="/api/projects/{{ p.id }}/update"
              hx-target="#projects_list"
              hx-swap="outerHTML">
          <div class="form-group" style="margin-bottom:10px;">
            <label style="font-size:13px;">Name</label>
            <input type="text" name="name" value="{{ p.name }}" style="max-width:320px;" />
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label style="font-size:13px;">Default Tags</label>
            <input type="text" name="tags_json" value="{{ p.tags_json }}" style="max-width:480px;" placeholder="#Gamedev #Indie" />
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label style="font-size:13px;">Replace Icon (leave empty to keep current)</label>
            {% if p.icon_url %}
              <div style="margin-bottom:6px;"><img src="{{ p.icon_url }}" style="width:36px; height:36px; border-radius:6px; object-fit:cover;" /></div>
            {% endif %}
            <input type="file" name="icon" accept="image/*" />
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label style="font-size:13px;">Sort Order</label>
            <input type="number" name="sort_order" value="{{ p.sort_order }}" style="width:80px;" />
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:13px;">Platform Overrides (JSON, advanced)</label>
            <textarea name="platforms_json" rows="3"
                      style="max-width:480px; font-family:monospace; font-size:12px;">{{ p.platforms_json }}</textarea>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="submit" class="btn btn-primary btn-sm">Save</button>
            <button type="button" class="btn btn-sm" onclick="toggleProjectEdit({{ p.id }})">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
{% else %}
  <div class="card" style="padding:20px; color:var(--muted); text-align:center; font-size:14px;">
    No projects yet. Create your first project above.
  </div>
{% endif %}
</div>

<script>
function toggleProjectEdit(id) {
  const view = document.querySelector('.project-view-' + id);
  const edit = document.querySelector('.project-edit-' + id);
  if (!view || !edit) return;
  const isEditing = edit.style.display !== 'none';
  view.style.display = isEditing ? 'flex' : 'none';
  edit.style.display = isEditing ? 'none' : 'block';
}
</script>
