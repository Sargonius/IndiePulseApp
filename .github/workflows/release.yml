# A v* tag (pushed by tools/release.ps1) → a GitHub Release with IndiePulse-<version>.zip and latest.json, which
# every installed IndiePulse checks for (app/services/updates.py). Only GITHUB_TOKEN: gh, which the runners have.
# Fails before building when the tag isn't v + app/__init__.py's __version__, or when the tests fail.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release, upload its assets

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for notes from commit subjects

      # checkout can leave an annotated tag as a lightweight one; its message is the release notes
      - name: The tag itself
        run: git fetch --force origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"

      - name: Tag matches __version__
        run: python tools\build_release.py --tag $env:TAG --check

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Python 3.12
        run: uv venv --python 3.12 .venv

      - name: Dependencies
        run: uv pip install --python .venv\Scripts\python.exe -r requirements-dev.txt

      - name: pyflakes
        run: .venv\Scripts\python.exe tools\lint.py

      - name: pytest
        run: .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider

      - name: Build the zip and latest.json
        id: build
        run: .venv\Scripts\python.exe tools\build_release.py --tag $env:TAG --repo $env:GITHUB_REPOSITORY --out dist

      # gh uploads the assets before it publishes, so the release never shows up without latest.json;
      # an -rc version is a prerelease, which /releases/latest (what IndiePulse checks) skips
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG "dist\IndiePulse-$env:VERSION.zip" dist\latest.json --verify-tag --title "IndiePulse $env:VERSION" --notes-file dist\notes.md @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
